
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerLens | Login</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>CareerLens</h1>
    <p class="subtitle">Welcome back! Sign in to continue your career journey.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password"
             placeholder="Enter your password" required>

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" class="status" role="status"></p>
    </form>

    <p class="auth-link">
      New to CareerLens? <a href="signup.html">Create an account</a>
    </p>
    <p class="auth-link"><a href="index.html">← Back to Home</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        const errors = {
          "auth/invalid-credential": "Incorrect email or password.",
          "auth/user-not-found": "Account not found. Please sign up first.",
          "auth/wrong-password": "Incorrect email or password.",
          "auth/invalid-email": "Please enter a valid email.",
          "auth/too-many-requests": "Too many attempts. Please try again later.",
          "auth/network-request-failed": "Network error. Check your internet connection."
        };

        message.textContent =
          errors[error.code] || "Sign-in failed: " + error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
